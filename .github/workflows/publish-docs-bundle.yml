name: Publish docs bundle

on:
  workflow_call:
    secrets:
      RELEASE_PR_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docs-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Create repository-scoped App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build docs bundle
        run: python3 scripts/build_docs_bundle.py

      - name: Open or update a docs bundle PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add publish/docs-bundle.json
          if git diff --staged --quiet; then
            echo "No changes to docs-bundle.json"
            exit 0
          fi
          git commit -m "chore: update docs bundle for frontend"
          bundle_branch="chore/update-docs-bundle"
          remote_head=$(git ls-remote origin "refs/heads/${bundle_branch}" | cut -f1)
          git push --force-with-lease="refs/heads/${bundle_branch}:${remote_head}" origin "HEAD:${bundle_branch}"
          open_prs="$(gh pr list --head "${bundle_branch}" --base main --state open --json number --jq 'length')" || exit 1
          if [ "${open_prs}" = "0" ]; then
            gh pr create --base main --head "${bundle_branch}" \
              --title "chore: update docs bundle for frontend" \
              --body "Automated update from the [Publish docs bundle](https://github.com/${{ github.repository }}/actions/workflows/publish-docs-bundle.yml) workflow. Merge after CI passes."
          else
            echo "PR already open for ${bundle_branch} -> main"
          fi
