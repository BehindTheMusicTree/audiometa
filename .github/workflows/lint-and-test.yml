# Maintainer-controlled: Lint and test on pull requests
# Contributors can suggest changes via PRs, but maintainers review and approve all CI/CD changes.
name: Lint and Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: BehindTheMusicTree/python-project-standards/.github/workflows/reusable-pre-commit.yml@v4.3.2
    with:
      runs-on: ubuntu-24.04
      python-version: "3.13"
      pre-install-command: |
        echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
        echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
        echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
        sudo apt-get update -qq
        bash scripts/install-system-dependencies-ubuntu.sh lint
      pre-commit-command: SKIP_SYSTEM_DEPENDENCY_VERIFICATION=true pre-commit run --all-files --verbose --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      COVERAGE_FAIL_UNDER: "80"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Pre-install (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
          echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
          echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          bash scripts/install-system-dependencies-ubuntu.sh

      - name: Pre-install (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/install-system-dependencies-macos.sh

      - name: Pre-install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-system-dependencies-windows.ps1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('requirements.txt') }}

      - name: Run unit tests
        if: runner.os != 'Windows'
        run: pytest -m unit --cov=audiometa --cov-report=xml --cov-report=term

      - name: Run integration tests
        if: runner.os != 'Windows'
        run: pytest -m integration --cov=audiometa --cov-report=xml --cov-report=term --cov-append

      - name: Run e2e tests
        run: pytest -m e2e --cov=audiometa --cov-report=xml --cov-report=term --cov-append

      - name: Check coverage threshold (fail-under)
        if: runner.os != 'Windows'
        run: coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }}

  lint-and-tests-success:
    name: Lint and tests success
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"
