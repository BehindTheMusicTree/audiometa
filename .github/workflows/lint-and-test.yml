# Maintainer-controlled: Lint and test on pull requests
# Contributors can suggest changes via PRs, but maintainers review and approve all CI/CD changes.
name: Lint and Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-and-test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: BehindTheMusicTree/python-project-standards/.github/workflows/reusable-pre-commit.yml@v5.1.0
    with:
      runs-on: ubuntu-24.04
      python-version: "3.13"
      pre-install-command: |
        echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
        echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
        echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
        sudo apt-get update -qq
        bash scripts/install-system-dependencies-ubuntu.sh lint
      pre-commit-command: SKIP_SYSTEM_DEPENDENCY_VERIFICATION=true pre-commit run --all-files --verbose --show-diff-on-failure

  classify:
    name: Select test matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      applicable: ${{ steps.select.outputs.applicable }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changes using the base revision's rules
        id: select
        shell: bash
        run: |
          selector_dir=$(mktemp -d)
          trap 'rm -rf "$selector_dir"' EXIT
          if git archive HEAD^1 scripts/select_test_matrix.py scripts/changelog.py | tar -x -C "$selector_dir" &&
             mode=$(python3 "$selector_dir/scripts/select_test_matrix.py"); then
            case "$mode" in
              docs) applicable=false ;;
              reduced|full) applicable=true ;;
              *) exit 1 ;;
            esac
          else
            mode=full
            applicable=true
          fi
          printf 'mode=%s\napplicable=%s\n' "$mode" "$applicable" >> "$GITHUB_OUTPUT"

  test:
    name: Audio tests
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    uses: ./.github/workflows/test-audio.yml
    permissions:
      contents: read
    with:
      full_matrix: ${{ needs.classify.outputs.mode != 'reduced' }}

  coverage:
    needs: test
    permissions:
      contents: read
    uses: BehindTheMusicTree/github-workflows/.github/workflows/coverage.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0

  # Needing coverage gates it too: a failed or skipped coverage job fails the gate when tests are applicable.
  tests-success:
    name: Tests success
    if: always()
    needs: [classify, test, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected tests to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          jq -e --arg scope classify
          '.[$scope] as $s | del(.[$scope]) as $rest | $s.result == "success" and ($rest | length) > 0 and (if $s.outputs.applicable == "true" then all($rest[]; .result == "success") elif $s.outputs.applicable == "false" then all($rest[]; .result == "skipped") else false end)'
          <<<"$NEEDS"
