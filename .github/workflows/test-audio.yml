name: Audio tests

on:
  workflow_call:
    inputs:
      full_matrix:
        type: boolean
        required: true
      ref:
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python-version: ["3.12", "3.13", "3.14"]
        exclude: ${{ fromJSON(inputs.full_matrix && '[]' || '[{"os":"macos-15","python-version":"3.12"},{"os":"macos-15","python-version":"3.14"},{"os":"windows-2022","python-version":"3.12"},{"os":"windows-2022","python-version":"3.13"}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Pre-install (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
          echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
          echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          bash scripts/install-system-dependencies-ubuntu.sh

      - name: Pre-install (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/install-system-dependencies-macos.sh

      - name: Pre-install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-system-dependencies-windows.ps1 -SkipLint

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('requirements.txt') }}

      - name: Run unit tests
        if: runner.os != 'Windows'
        run: pytest -m unit --cov=audiometa --cov-branch --cov-report=xml --cov-report=term

      - name: Run integration tests
        if: runner.os != 'Windows'
        run: pytest -m integration --cov=audiometa --cov-branch --cov-report=xml --cov-report=term --cov-append

      - name: Run e2e tests
        run: pytest -m e2e --cov=audiometa --cov-branch --cov-report=xml --cov-report=term --cov-append

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
