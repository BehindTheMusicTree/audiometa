# Maintainer-only: Repository automation workflow
# Contributors cannot modify this file. Changes to automation policies require maintainer approval.
name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: auto-label-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Auto-label based on files changed
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
          configuration-path: .github/labeler.yml

