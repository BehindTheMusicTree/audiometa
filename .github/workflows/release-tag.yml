name: Release tag

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pushed commit, never cancelled or replaced: release-tag validates only before..after,
# so a replaced run would leave its bump untagged.
concurrency:
  group: release-tag-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-tag:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-tag.yml@79c136234b5d487bb99e0cd2050f38f6b3e06747
    with:
      app-id: "5524079"
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
