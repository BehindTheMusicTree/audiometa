# Maintainer-only: PyPI Publishing workflow
# Contributors cannot modify this file. Changes to publishing infrastructure require maintainer approval.
# Publishing workflows handle sensitive secrets and can publish packages to PyPI.
name: Publish to PyPI

on:
  push:
    branches:
      - main # A merged release PR bumps the version in pyproject.toml; the tag job tags it
    paths:
      - pyproject.toml
    tags:
      - "v*" # Manual tag push (v0.3.0, v1.0.0, etc.) re-runs validation and publish

jobs:
  tag:
    name: Tag release version
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag_release.outputs.version }}
      release: ${{ steps.tag_release.outputs.release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Tags pushed with GITHUB_TOKEN do not trigger new workflow runs, so validate and publish run in this same run.
      - name: Tag the version in pyproject.toml if it is a new release
        id: tag_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "Extracted version: $VERSION"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version $VERSION is not x.x.x (pre-release, dev, or other). Not tagging."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists. pyproject.toml changed without a version bump; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" -f message="Release $VERSION" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$TAG_OBJECT" > /dev/null
          echo "Created tag v$VERSION on $GITHUB_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate tag and version
    runs-on: ubuntu-latest
    needs: tag
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.tag.outputs.release == 'true') }}
    outputs:
      is_release_version: ${{ steps.check_release_version.outputs.is_release_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full history for tag verification

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version from pyproject.toml
        id: extract_version
        run: |
          VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Verify tag and branch (version match + tag on main)
        run: |
          set -e
          PROJECT_VERSION="${{ steps.extract_version.outputs.version }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_COMMIT=$(git rev-parse "$GITHUB_REF")
          else
            TAG_VERSION="${{ needs.tag.outputs.version }}"
            TAG_COMMIT="$GITHUB_SHA"
          fi

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match pyproject.toml ($PROJECT_VERSION). Use tag v$PROJECT_VERSION"
            exit 1
          fi

          git fetch origin main:main 2>/dev/null || true
          if ! git branch --contains "$TAG_COMMIT" | grep -q "main"; then
            echo "Error: Tag is not on main. Publishing only allowed from main."
            echo "Push to main first, then tag: git tag v$PROJECT_VERSION && git push origin v$PROJECT_VERSION"
            exit 1
          fi

          echo "✓ Tag matches version and is on main"

      # Releases assume branch protection requires "Lint and Test" so only CI-passed code is on main.
      - name: Check if release version (x.x.x)
        id: check_release_version
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          # Only publish when version is exactly x.x.x (e.g. 1.0.0). Skip for pre-release, dev, or other.
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_release_version=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION is x.x.x. Proceeding with publish."
          else
            echo "is_release_version=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is not x.x.x (pre-release, dev, or other). Skipping PyPI publish."
          fi

  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.is_release_version == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version from pyproject.toml
        id: extract_version
        run: |
          VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build package
        run: |
          python -m build

      - name: Check package contents
        run: |
          echo "Source distribution contents:"
          tar -tzf dist/*.tar.gz | head -30
          echo ""
          echo "Wheel contents:"
          unzip -l dist/*.whl | head -30

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          # TestPyPI doesn't allow re-uploading the same version (returns 400 Bad Request)
          # A version may already exist on TestPyPI in these scenarios:
          # 1. Previous workflow run succeeded in uploading to TestPyPI but failed later (e.g., PyPI upload or verification)
          # 2. Manual testing uploads to TestPyPI before the automated workflow runs
          # 3. Republishing the same version after fixing CI/CD issues (like retry logic)
          # 4. Workflow was re-run after a partial failure
          # Check if version already exists, skip upload if it does to avoid 400 errors
          VERSION="${{ steps.extract_version.outputs.version }}"
          if curl -s "https://test.pypi.org/pypi/audiometa-python/${VERSION}/json" | grep -q '"version"'; then
            echo "Version ${VERSION} already exists on TestPyPI, skipping upload"
            echo "This is expected when republishing or when a previous workflow run partially succeeded"
          else
            echo "Uploading version ${VERSION} to TestPyPI..."
            twine upload --repository-url https://test.pypi.org/legacy/ dist/*
          fi

      - name: Verify TestPyPI publication by installing
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          echo "Waiting for TestPyPI to propagate package version ${VERSION}..."
          sleep 10

          # Retry logic: TestPyPI might need a moment to update
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            python -m pip install --upgrade pip
            if pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ audiometa-python==${VERSION} 2>&1; then
              echo "✓ Successfully installed audiometa-python==${VERSION} from TestPyPI"
              python -c "import audiometa; print('Successfully installed from TestPyPI')"
              python -c "from audiometa import get_unified_metadata; print('Package imports and functions work correctly')"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Package not yet available on TestPyPI, retrying in 5 seconds... (attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 5
              else
                echo "Error: Could not install audiometa-python==${VERSION} from TestPyPI after ${MAX_RETRIES} attempts"
                exit 1
              fi
            fi
          done

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

      - name: Verify PyPI publication by installing
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          echo "Waiting for PyPI to propagate package version ${VERSION}..."
          sleep 10

          # Retry logic: PyPI might need a moment to update
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            python -m pip install --upgrade pip
            if pip install audiometa-python==${VERSION} 2>&1; then
              echo "✓ Successfully installed audiometa-python==${VERSION} from PyPI"
              python -c "import audiometa; print('Successfully installed from PyPI')"
              python -c "from audiometa import get_unified_metadata; print('Package imports and functions work correctly')"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Package not yet available on PyPI, retrying in 5 seconds... (attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 5
              else
                echo "Error: Could not install audiometa-python==${VERSION} from PyPI after ${MAX_RETRIES} attempts"
                exit 1
              fi
            fi
          done

      - name: Post-publish verification check
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          PACKAGE_NAME="audiometa-python"

          echo "Verifying package availability on PyPI..."
          echo "Waiting a few seconds for PyPI to propagate the package..."
          sleep 5

          # Retry logic: PyPI API might need a moment to update
          MAX_RETRIES=5
          RETRY_COUNT=0
          API_RESPONSE=""

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            API_RESPONSE=$(curl -s "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json" 2>/dev/null || echo "")

            if [ -n "$API_RESPONSE" ] && [ "$API_RESPONSE" != "null" ] && [ "$API_RESPONSE" != "Not Found" ]; then
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Package not yet available, retrying in 3 seconds... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep 3
            fi
          done

          if [ -z "$API_RESPONSE" ] || [ "$API_RESPONSE" = "null" ] || [ "$API_RESPONSE" = "Not Found" ]; then
            echo "Error: Package version ${VERSION} not found on PyPI after ${MAX_RETRIES} attempts"
            exit 1
          fi

          # Verify version matches
          API_VERSION=$(echo "$API_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "")
          if [ "$API_VERSION" != "$VERSION" ]; then
            echo "Error: Version mismatch. Expected ${VERSION}, got ${API_VERSION}"
            exit 1
          fi

          # Verify package name matches
          API_NAME=$(echo "$API_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['name'])" 2>/dev/null || echo "")
          if [ "$API_NAME" != "$PACKAGE_NAME" ]; then
            echo "Error: Package name mismatch. Expected ${PACKAGE_NAME}, got ${API_NAME}"
            exit 1
          fi

          echo "✓ Package verified on PyPI API"
          echo "✓ Version matches: ${VERSION}"
          echo "✓ Package name matches: ${PACKAGE_NAME}"
          echo ""
          echo "Package published successfully!"
          echo "View on PyPI: https://pypi.org/project/${PACKAGE_NAME}/${VERSION}/"
          echo ""
          echo "Install with: pip install ${PACKAGE_NAME}==${VERSION}"
