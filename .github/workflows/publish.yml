# Maintainer-only: publishing infrastructure requires maintainer approval.
name: Publish to PyPI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      TEST_PYPI_API_TOKEN:
        required: true
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Validate release and build distributions
    uses: BehindTheMusicTree/github-workflows/.github/workflows/publish-python.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    with:
      release-tag: ${{ inputs.tag }}
      package-name: audiometa-python
      python-version: "3.13"

  test:
    name: Release tests
    needs: build
    uses: ./.github/workflows/test-audio.yml
    with:
      full_matrix: true
      ref: ${{ github.sha }}

  publish:
    name: Publish wheel and sdist
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      PACKAGE: audiometa-python
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: ${{ needs.build.outputs.foundation-sha }}
          persist-credentials: false
          path: foundation

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install publisher and smoke test the wheel
        run: |
          python -m pip install twine dist/*.whl
          python -I -c 'from audiometa import get_unified_metadata'

      - name: Prepare TestPyPI upload
        id: testpypi
        run: python foundation/release/python-artifact.py prepare "$PACKAGE" "$VERSION" dist pending-testpypi --registry testpypi

      - name: Upload missing distributions to TestPyPI
        if: steps.testpypi.outputs.upload-needed == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --repository testpypi pending-testpypi/*

      - name: Verify TestPyPI distributions
        run: python foundation/release/python-artifact.py verify "$PACKAGE" "$VERSION" dist --registry testpypi

      - name: Prepare PyPI upload
        id: pypi
        run: python foundation/release/python-artifact.py prepare "$PACKAGE" "$VERSION" dist pending-pypi

      - name: Upload missing distributions to PyPI
        if: steps.pypi.outputs.upload-needed == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive pending-pypi/*

      - name: Verify PyPI distributions
        run: python foundation/release/python-artifact.py verify "$PACKAGE" "$VERSION" dist
