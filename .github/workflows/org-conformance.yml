name: Org conformance

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: org-conformance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  org-conformance:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/org-conformance.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    permissions:
      contents: read
